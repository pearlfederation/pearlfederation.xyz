<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ee">
  <meta name="description" content="We are building Pearl Federation, a completely decentralized pool.">
  <meta property="og:title" content="Pearl Federation">
  <meta property="og:description" content="We are building Pearl Federation, a completely decentralized pool. Come talk to us.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pearlfederation.xyz/">
  <meta property="og:image" content="https://pearlfederation.xyz/assets/pearl-federation.png">
  <meta property="og:image:width" content="1400">
  <meta property="og:image:height" content="1400">
  <meta property="og:image:alt" content="The blue and gold flag of Pearl Federation">
  <link rel="canonical" href="https://pearlfederation.xyz/">
  <link rel="icon" type="image/png" href="assets/pearl-federation.png">
  <title>Pearl Federation</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7f5ee;
      color: #142f4e;
      font-family: Georgia, "Times New Roman", serif;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 46rem);
      margin-inline: auto;
      padding: clamp(1.5rem, 6vh, 4rem) 1.5rem 4rem;
    }
    h1 { margin: 0 0 2rem; line-height: 0; }
    .logo { display: block; width: 17rem; max-width: 65vw; height: auto; }
    p { margin: 0; font-size: clamp(1.125rem, 2.6vw, 1.375rem); line-height: 1.65; }
    .grievances p + p { margin-top: .7rem; }
    .purpose, .launch { margin-top: 1.8rem; }
    .contact { margin-top: 1.8rem; }
    strong { font-weight: 700; }
    a { color: inherit; text-decoration-color: #b08b50; text-underline-offset: .2em; overflow-wrap: anywhere; }
    a:hover { text-decoration-color: currentColor; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; border-radius: 2px; }
    @media (max-width: 420px) {
      main { padding-inline: 1.25rem; }
      h1 { margin-bottom: 1.5rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1><img class="logo" src="assets/pearl-federation-lockup.svg" width="1000" height="1000" alt="Pearl Federation"></h1>
    <div class="grievances">
      <p>We got tired of PPS pools taking more than their stated fee.</p>
      <p>We got tired of PROP pools misrepresenting their pool's hashrate.</p>
    </div>
    <p class="purpose">So we are building <strong>Pearl Federation</strong>, a completely decentralized pool.</p>
    <p class="launch">Expected Launch Date: October 28</p>
    <p class="contact">Come talk to us: <a href="https://discord.gg/mqT28KZBC4">https://discord.gg/mqT28KZBC4</a></p>
  </main>
</body>
</html>
